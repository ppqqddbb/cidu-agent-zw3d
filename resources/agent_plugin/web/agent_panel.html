        <div class="subtitle">jiavu 混合检索选型、依据、参数需求</div>
      </div>
      <div class="header-actions">
        <button
          type="button"
          class="icon-btn knowledge-sync-btn"
          id="knowledgeBtn"
          title="更新知识库和知识图谱"
          aria-label="更新知识库和知识图谱"
          data-tooltip="从佳鱼数据库重新生成插件本地知识库和知识图谱；如已填写 Dify 同步配置，会同步到生产环境。">
          <span class="sync-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="8" cy="5" rx="5" ry="2.3"></ellipse>
              <path d="M3 5v8c0 1.3 2.2 2.3 5 2.3s5-1 5-2.3V5"></path>
              <path d="M3 9c0 1.3 2.2 2.3 5 2.3s5-1 5-2.3"></path>
              <path d="M15.5 8.5h2.2a2.3 2.3 0 0 1 2.3 2.3v1.7"></path>
              <circle cx="20" cy="16.5" r="2"></circle>
              <circle cx="14.5" cy="19" r="2"></circle>
              <path d="M18.2 17.3l-1.9.9"></path>
            </svg>
          </span>
          <span class="sync-progress-text" id="knowledgeProgressText" aria-hidden="true"></span>
          <span class="sync-progress-bar" aria-hidden="true"></span>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" title="设置">⚙</button>
        <button type="button" class="icon-btn" id="historyBtn" title="历史会话">☰</button>
        <button type="button" class="icon-btn" id="newChatBtn" title="新建对话">＋</button>
      </div>
    </header>

    <div class="modal-backdrop" id="settingsModal" aria-hidden="true">
      <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-head">
          <span id="settingsTitle">智能体设置</span>
          <button type="button" class="icon-btn" id="closeSettingsBtn" title="关闭">×</button>
        </div>
        <div class="settings-body">
          <div class="settings-section">
            <div class="settings-section-title">智能体</div>
            <div class="field">
              <label for="baseUrlInput">智能体地址</label>
              <input id="baseUrlInput" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div class="field">
              <label for="apiKeyInput">API Key</label>
              <div class="password-wrap">
                <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false">
                <button type="button" class="password-toggle" data-target="apiKeyInput" aria-label="显示/隐藏" title="显示/隐藏">
                  <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.79 19.79 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.86 19.86 0 0 1-3.16 3.75"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-section-title">佳鱼数据库</div>
            <div class="settings-grid">
              <div class="field">
                <label for="jiavuDbHostInput">地址</label>
                <input id="jiavuDbHostInput" type="text" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="jiavuDbPortInput">端口</label>
                <input id="jiavuDbPortInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
              </div>
            </div>
            <div class="field">
              <label for="jiavuDbNameInput">数据库名</label>
              <input id="jiavuDbNameInput" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div class="settings-grid">
              <div class="field">
                <label for="jiavuDbUserInput">用户名</label>
                <input id="jiavuDbUserInput" type="text" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="jiavuDbPasswordInput">密码</label>
                <div class="password-wrap">
                  <input id="jiavuDbPasswordInput" type="password" autocomplete="off" spellcheck="false">
                  <button type="button" class="password-toggle" data-target="jiavuDbPasswordInput" aria-label="显示/隐藏" title="显示/隐藏">
                    <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.79 19.79 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.86 19.86 0 0 1-3.16 3.75"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="field">
              <label for="jiavuModelExcelDirInput">生成模型 Excel 目录</label>
              <input id="jiavuModelExcelDirInput" type="text" autocomplete="off" spellcheck="false">
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-section-title">Dify 知识同步</div>
            <div class="field">
              <label for="difySyncBaseUrlInput">同步地址</label>
              <input id="difySyncBaseUrlInput" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div class="field">
              <label for="difyDatasetApiKeyInput">Dataset API Key</label>
              <div class="password-wrap">
                <input id="difyDatasetApiKeyInput" type="password" autocomplete="off" spellcheck="false">
                <button type="button" class="password-toggle" data-target="difyDatasetApiKeyInput" aria-label="显示/隐藏" title="显示/隐藏">
                  <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.79 19.79 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.86 19.86 0 0 1-3.16 3.75"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <div class="settings-grid">
              <div class="field">
                <label for="difyDatasetIdInput">知识库 ID</label>
                <input id="difyDatasetIdInput" type="text" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="difyKnowledgeGraphIdInput">图谱 ID</label>
                <input id="difyKnowledgeGraphIdInput" type="text" autocomplete="off" spellcheck="false">
              </div>
            </div>
            <div class="settings-grid">
              <div class="field">
                <label for="difyDatasetIndexingTechniqueInput">索引方式</label>
                <input id="difyDatasetIndexingTechniqueInput" type="text" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="difyKnowledgeBaseDocumentNameInput">文档前缀</label>
                <input id="difyKnowledgeBaseDocumentNameInput" type="text" autocomplete="off" spellcheck="false">
              </div>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-section-title">佳鱼解密服务 (jyasm-service)</div>
            <div class="field">
              <label for="jyasmServiceBaseUrlInput">内网地址</label>
              <input id="jyasmServiceBaseUrlInput" type="text" autocomplete="off" spellcheck="false" placeholder="http://192.168.2.67:8765">
            </div>
            <div class="field">
              <label for="jyasmServiceTokenInput">Auth Token</label>
              <div class="password-wrap">
                <input id="jyasmServiceTokenInput" type="password" autocomplete="off" spellcheck="false">
                <button type="button" class="password-toggle" data-target="jyasmServiceTokenInput" aria-label="显示/隐藏" title="显示/隐藏">
                  <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.79 19.79 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.86 19.86 0 0 1-3.16 3.75"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="jyasmServicePublicBaseUrlInput">图片公网地址</label>
              <input id="jyasmServicePublicBaseUrlInput" type="text" autocomplete="off" spellcheck="false" placeholder="留空则与内网地址相同">
            </div>
            <div class="settings-grid">
              <div class="field">
                <label for="jyasmServiceTriggerRefreshInput">触发增量解密</label>
                <input id="jyasmServiceTriggerRefreshInput" type="text" autocomplete="off" spellcheck="false" placeholder="true / false">
              </div>
              <div class="field">
                <label for="jyasmServiceTimeoutMsInput">超时 (ms)</label>
                <input id="jyasmServiceTimeoutMsInput" type="text" autocomplete="off" spellcheck="false" placeholder="900000">
              </div>
            </div>
          </div>
        </div>
        <div class="settings-actions">
          <button type="button" id="cancelSettingsBtn">取消</button>
          <button type="button" class="send" id="saveSettingsBtn">保存</button>
        </div>
      </section>
    </div>

    <aside class="history-panel" id="historyPanel">
      <div class="history-head">
        <span>历史会话</span>
        <button type="button" class="icon-btn" id="closeHistoryBtn" title="关闭">×</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>

    <section class="chat" id="chat">
      <div class="empty" id="empty">
        <strong>描述你要设计的零件或结构</strong>
        <span>我会返回选型模型、检索依据和所需参数。</span>
      </div>
    </section>

    <footer class="composer">
      <div class="attachments" id="attachments"></div>
      <div class="input-wrap">
        <textarea id="prompt" placeholder="输入选型需求"></textarea>
        <div class="toolbar">
          <button type="button" id="attachBtn">选择附件</button>
          <button type="button" id="clearFilesBtn">移除附件</button>
          <button type="button" id="clearBtn">清空</button>
          <button type="button" class="send" id="sendBtn">发送</button>
        </div>
        <div class="shortcut-hint" id="shortcutHint" title="右键切换发送快捷键"></div>
      </div>
      <div class="status" id="status"></div>
    </footer>
  </main>

  <!-- CIDU_PANEL_SCRIPT -->
</body>
</html>
