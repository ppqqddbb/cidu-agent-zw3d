            \ |\n| max_slag_rate | 锅炉最大排渣量 | [数值] | t/h | 技术协议｜[位置]：[原文短句] |\n| l1\
            \ | 锅炉下联箱长度 L1 | [数值] | mm | 技术协议｜[位置]：[原文短句] |\n| l3 | 渣仓中心至锅炉下联箱中心水平距离\
            \ L3 | [数值] | mm | 技术协议｜[位置]：[原文短句] |\n| t1 | 锅炉下联箱标高 T1 | [数值] | mm |\
            \ 技术协议｜[位置]：[原文短句] |\n| jv | 渣井有效容积 JV | [数值] | m³ | 技术协议｜[位置]：[原文短句]\
            \ |\n| n | 渣井口数 N | [数值] | 个 | 技术协议｜[位置]：[原文短句] |\n| cv1 | 干渣仓有效容积 CV1\
            \ | [数值] | m³ | 技术协议｜[位置]：[原文短句] |\n| d1 | 干渣仓直径 D1 | [数值] | mm | 技术协议｜[位置]：[原文短句]\
            \ |\n| ct1 | 干渣仓锥体顶标高 CT1 | [数值] | mm | 技术协议｜[位置]：[原文短句] |\n| cone_included_angle\
            \ | 干渣仓锥斗夹角 | [数值] | ° | 技术协议｜[位置]：[原文短句] |\n| repose_angle | 灰渣安息角 |\
            \ [数值] | ° | 技术协议｜[位置]：[原文短句] |\n| install_clearance | 安装间隙 | [数值] | mm\
            \ | 技术协议｜[位置]：[原文短句] |\n| fixed_horizontal_extension | 固定端水平延伸量 | [数值]\
            \ | mm | 技术协议｜[位置]：[原文短句] |\n| thermal_displacement | 热位移量 | [数值] | mm\
            \ | 技术协议｜[位置]：[原文短句] |\n| slag_well_angle | 渣井倾角/壳体倾角 | [数值] | ° | 技术协议｜[位置]：[原文短句]\
            \ |\n| unloading_rate | 卸料出力 | [数值] | t/h | 技术协议｜[位置]：[原文短句] |\n| gate_stroke\
            \ | 液压关断门行程 | [数值/null] | mm | 技术协议｜[位置]：[原文短句] |\n\n## \U0001F4DD 字段定义与抽取指南\n\
            \n| 参数标识 | 参数中文名称 | 单位 | 抽取线索/关键词 |\n| :--- | :--- | :--- | :--- |\n|\
            \ **boiler_capacity** | 锅炉容量 | MW | \"机组容量\"、\"660MW\"、\"2×66万千瓦\" |\n\
            | **max_slag_rate** | 锅炉最大排渣量 | t/h | \"BMCR工况\"、\"吹灰时最大排渣量\"、\"校核煤种\"\
            、\"最大出力\" |\n| **l1** | 锅炉下联箱长度 L1 | mm | \"下联箱长度\"、\"L1\"、\"排渣口宽度\" |\n\
            | **l3** | 渣仓中心至锅炉下联箱中心水平距离 L3 | mm | \"中心距\"、\"L3\"、\"水平距离\" |\n| **t1**\
            \ | 锅炉下联箱标高 T1 | mm | \"下联箱标高\"、\"T1\"、\"零米层以上高度\" |\n| **jv** | 渣井有效容积\
            \ JV | m³ | \"渣井容积\"、\"JV\"、\"过渡渣斗容积\"、\"6小时储渣量\" |\n| **n** | 渣井口数 N\
            \ | 个 | \"排渣口数量\"、\"N\"、\"几对门\"、\"分口数\" |\n| **cv1** | 干渣仓有效容积 CV1 | m³\
            \ | \"渣仓有效容积\"、\"CV1\"、\"贮渣量\"、\"48小时\" |\n| **d1** | 干渣仓直径 D1 | mm |\
            \ \"渣仓直径\"、\"D1\"、\"Ф8\"、\"仓体直径\" (注意：若原文为Ф8m，数值填8000，单位填mm) |\n| **ct1**\
            \ | 干渣仓锥体顶标高 CT1 | mm | \"锥段顶标高\"、\"CT1\"、\"支架顶标高\" |\n| **cone_included_angle**\
            \ | 干渣仓锥斗夹角 | ° | \"底锥夹角\"、\"锥角\"、\"70°\"、\"水平夹角β\" |\n| **repose_angle**\
            \ | 灰渣安息角 | ° | \"安息角\"、\"γ\"、\"堆积角\"、\"32°\" |\n| **install_clearance**\
            \ | 安装间隙 | mm | \"安装间隙\"、\"200mm\"、\"预留空间\" |\n| **fixed_horizontal_extension**\
            \ | 固定端水平延伸量 | mm | \"水平段固定长度\"、\"4500mm\"、\"L1+4500\" |\n| **thermal_displacement**\
            \ | 热位移量 | mm | \"热向下膨胀\"、\"Jδ\"、\"位移量\"、\"600mm\" |\n| **slag_well_angle**\
            \ | 渣井倾角/壳体倾角 | ° | \"渣井倾角\"、\"60°\"、\"固定倾角\" |\n| **unloading_rate**\
            \ | 卸料出力 | t/h | \"卸料出力\"、\"100t/h\"、\"散装机出力\"、\"搅拌机出力\" |\n| **gate_stroke**\
            \ | 液压关断门行程 | mm | \"行程\"、\"600mm\"、\"开关行程\" |\n\n## ⚠️ 执行指令\n收到技术协议内容后，立即执行抽取，严格按上述\
            \ **5列 Markdown 表格** 格式输出。不确认、不解释、不扩展。\n\n## \U0001F9ED 实事求是与防幻觉规则（必须遵守）\n\
            1. 只能抽取“技术协议原文明确声明为该参数本身”的值；不得从公式说明、安装布置说明、设备结构说明、经验规则、示例公式、不可承载长度、预留描述中推断参数。\n\
            2. 证据短句中必须同时出现以下至少一种强绑定线索，才允许填非 null：\n   - 参数标识本身，例如 L1、L3、T1、JV、CV1、D1、CT1、Jδ；\n\
            \   - 参数中文名称或同义名称，例如“锅炉下联箱长度”“渣仓中心距”“固定端水平延伸量”；\n   - 明确表格字段，例如“性能数据表/设计参数表/接口条件表”中的字段名和值。\n\
            3. 如果证据只是“尾部有3m无法承载物料但需算在设备总长内”“水平段有一段无法承载”“安装布置方式”“公式计算示例”“L1+4500”这类说明，不得提取为\
            \ fixed_horizontal_extension 或其他参数，必须填 null。\n4. fixed_horizontal_extension\
            \ 只有在原文明确写出“固定端水平延伸量/水平段固定长度/固定长度/固定端延伸量”等字段，且该字段直接对应数值时才可提取；否则填 null。\n\
