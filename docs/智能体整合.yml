    - data:
        code: "import json\n\ndef _pick_text(raw):\n    text = str(raw or \"\").strip()\n\
          \    if not text:\n        return \"\"\n    try:\n        data = json.loads(text)\n\
          \    except Exception:\n        return text\n    if isinstance(data, dict):\n\
          \        for key in (\"markdown_content\", \"markdown\", \"text\", \"content\"\
          , \"result\", \"output\"):\n            value = data.get(key)\n        \
          \    if isinstance(value, str) and value.strip():\n                return\
          \ value.strip()\n        return text\n    if isinstance(data, list):\n \
          \       parts = []\n        for item in data:\n            picked = _pick_text(json.dumps(item,\
