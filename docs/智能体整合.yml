    - data:
        code: "import json\n\n\ndef _as_dict(value) -> dict:\n    return value if\
          \ isinstance(value, dict) else {}\n\n\ndef _as_list(value) -> list:\n  \
          \  return value if isinstance(value, list) else []\n\n\ndef _clean(value)\
          \ -> str:\n    return str(value or \"\").strip()\n\n\ndef _load_json(value:\
          \ str) -> dict:\n    text = _clean(value)\n    if not text:\n        return\
          \ {}\n    try:\n        data = json.loads(text)\n        return data if\
          \ isinstance(data, dict) else {}\n    except Exception:\n        return\
          \ {}\n\n\ndef _score_signals(signals: dict) -> int:\n    signals = _as_dict(signals)\n\
          \    if not signals:\n        return 0\n    score = 0\n    if _clean(signals.get(\"\
          intent\")):\n        score += 2\n    if _as_list(signals.get(\"selection_confirmed_candidates\"\
          )):\n        score += 12\n    if _as_dict(signals.get(\"selection_confirmed_candidate\"\
          )):\n        score += 8\n    if _as_list(signals.get(\"selection_choices\"\
          )):\n        score += 5\n    if signals.get(\"previous_candidates\"):\n\
          \        score += 4\n    if signals.get(\"model_name_hints\") or signals.get(\"\
          template_hints\"):\n        score += 3\n    if signals.get(\"keywords\"\
          ):\n        score += 2\n    if signals.get(\"selection_qualifiers\"):\n\
          \        score += 2\n    if _as_dict(signals.get(\"extracted_parameters\"\
          )):\n        score += 2\n    return score\n\n\ndef _merge_missing_selection_fields(chosen:\
          \ dict, fallback: dict) -> dict:\n    chosen = dict(_as_dict(chosen))\n\
          \    fallback = _as_dict(fallback)\n    for key in [\n        \"selection_choices\"\
          ,\n        \"selection_choice\",\n        \"selection_confirmed_candidates\"\
          ,\n        \"selection_confirmed_candidate\",\n        \"previous_candidates\"\
          ,\n        \"equipment_selection_markdown\",\n        \"equipment_selection_parameters\"\
          ,\n    ]:\n        if chosen.get(key) in (None, \"\", [], {}) and fallback.get(key)\
          \ not in (None, \"\", [], {}):\n            chosen[key] = fallback.get(key)\n\
          \    if _clean(fallback.get(\"intent\")) == \"confirm_selection\" and _as_list(fallback.get(\"\
          selection_choices\")):\n        chosen[\"intent\"] = \"confirm_selection\"\
          \n    return chosen\n\n\ndef main(\n    preflight_signals: str = \"\",\n\
          \    enriched_signals: str = \"\",\n    preflight_retrieval_query: str =\
          \ \"\",\n    enriched_retrieval_query: str = \"\",\n) -> dict:\n    preflight\
          \ = _load_json(preflight_signals)\n    enriched = _load_json(enriched_signals)\n\
          \    use_enriched = _score_signals(enriched) >= _score_signals(preflight)\
          \ and bool(enriched)\n    chosen = enriched if use_enriched else preflight\n\
          \    fallback = preflight if use_enriched else enriched\n    if not chosen:\n\
          \        chosen = {\"intent\": \"new_selection\"}\n    chosen = _merge_missing_selection_fields(chosen,\
          \ fallback)\n    retrieval_query = _clean(enriched_retrieval_query if use_enriched\
          \ else preflight_retrieval_query)\n    return {\n        \"signals_json\"\
          : json.dumps(chosen, ensure_ascii=False, separators=(\",\", \":\")),\n \
          \       \"intent\": _clean(chosen.get(\"intent\")) or \"new_selection\"\
          ,\n        \"retrieval_query\": retrieval_query,\n        \"empty_retrieval_result\"\
          : [],\n    }"
