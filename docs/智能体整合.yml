            2. **优先扫描**正文、表格（特别是“性能数据表”、“设计参数表”、“接口条件表”、“设备规范表”）。\n3. **智能映射**：若字段名称与原文表述不完全一致，但结合单位、上下文或符号映射可以明确对应，必须抽取。\n\
            4. **严禁参考**：不要参考选型计算方法文件，不要使用用户补录值，不要使用历史会话值。\n5. **空值处理**：仅当原文确实没有明确值，或存在多个冲突候选且无法判定时，该字段值填\
            \ `null`，证据栏填 `未找到明确依据`。\n\n## \U0001F4E4 输出格式要求\n- **只输出一个 Markdown 表格**，禁止输出\
            \ JSON，禁止输出代码块，禁止输出任何解释性文字。\n- 表格包含 **五列**：`参数标识`、`参数中文名称`、`数值`、`单位`、`证据溯源`。\n\
            - **数值列**：仅保留纯数字（支持小数、负数）。若原文为范围（如 `400~500`），优先提取最大值或设计给定值；若无法确定，填 `null`。\n\
            - **单位列**：仅保留标准单位符号（如 `MW`, `t/h`, `mm`, `m³`, `°`）。若原文无单位或为型号代码，填 `-`。\n\
            - **证据溯源列**：必须携带文件上下文，格式统一为：`技术协议｜第X章/第X节/表X/条款X：原文短句`。若无法精确识别章节，可写`技术协议｜相邻标题/表名/段落：原文短句`。\n\
            \n## \U0001F4CB 输出模板\n\n| 参数标识 | 参数中文名称 | 数值 | 单位 | 证据溯源 |\n| :--- | :---\
