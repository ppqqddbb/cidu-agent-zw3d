          ^(?:设计|生成|创建|新建|建立|制作|做|画|建模|选型|选择|匹配|识别)\", \"\", value)\n    return _normalize_phrase(value)\n\
          \n\ndef _all_qualifier_terms() -> list:\n    terms = []\n    for group in\
