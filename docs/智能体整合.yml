            \ JSON。\n\n可选 route：\n- query：查询识别全文，例如查询外购件、查询某设备、查看某清单。\n- extract：参数提取。\n\
            - supplement：参数补充。\n- modify：修改、添加、删除、替换、编辑历史表格。\n- calculate：开始计算、选型计算、公式计算。\n\
            - message：只是查看已保存表格或缺少前置条件时直接回复。\n\n可选 target_table：\n- external：外购件表、国产分包与外购件清单、序号/设备名称/识别结果/数量/单位/依据表。\n\
            - param：参数表、参数提取表、参数标识/参数中文名称/数值/单位/证据溯源表。\n- last：上一轮或最近表格。\n- none：无需表格。\n\
            \n识别规则：\n1. 用户说“查询外购件、查看外购件、国产分包与外购件清单”，route=query，target_table=external。\n\
            2. 用户说“参数提取、提取参数”，route=extract，target_table=param。\n3. 用户说“参数补充、补充参数”，route=supplement，target_table=param。\n\
            4. 用户只说“选型计算”时，route=extract，target_table=param，action=extract_param，也就是执行“参数提取”功能。\n\
            5. 用户说“开始计算、公式计算、进行计算、确认计算”时，route=calculate，target_table=param。\n6. 用户说“修改、改为、改成、替换、添加、新增、删除、移除、调整”等，route=modify。\n\
            7. 修改时要分析被修改内容属于哪张历史表：如果内容出现在外购件表或像“液压机、油缸、液压站”等设备名称，target_table=external；如果内容是\
            \ boiler_capacity、l1、锅炉容量等参数，target_table=param。\n8. 如果用户说“将液压机修改为液压站”，应判断为\
            \ route=modify、action=replace、target_table=external、source_terms 包含“液压机”、target_terms\
            \ 包含“液压站”。\n9. 如果用户说“查看当前外购件表”，且已保存外购件表存在，route=message、target_table=external。\n\
            \n输出 JSON 字段：\n{\n  \"route\": \"query/extract/supplement/modify/calculate/message\"\
            ,\n  \"action\": \"query_external/extract_param/supplement_param/replace/add/delete/update/view/calculate/general_query/unknown\"\
            ,\n  \"target_table\": \"external/param/last/none\",\n  \"source_terms\"\
            : [\"需要被修改或删除的原内容\"],\n  \"target_terms\": [\"修改后的新内容或新增内容\"],\n  \"operation_summary\"\
            : \"用一句话概括用户要做什么\",\n  \"requires_history\": true,\n  \"confidence\":\
            \ 0.0\n}\n\n只输出 JSON，不要输出 Markdown、代码块或解释。\n\n\n## 参数赋值模板识别规则（必须遵守）\n\
            1. 用户输入中如果出现形如 “l1（锅炉下联箱长度 L1，单位 mm）=19300” 的参数赋值行，不论“参数修改/修改参数”出现在开头、结尾、某一行末尾，还是完全没有出现，都应优先识别为\
            \ route=modify、target_table=param。\n2. 多行参数赋值需要整体处理，action=param_assignment_update，source_terms\
            \ 填参数标识列表，target_terms 填 key=value 列表。\n3. “修改、添加、新增、删除、移除、替换、改为、改成、调整、更新”等操作词可出现在用户输入任意位置，不能只看开头。\n\
            4. 如果用户同时提供参数赋值和“参数修改”，不要识别为 query，也不要识别为 supplement；这是对已保存参数表的修改。\n\n\
            \n## 直接粘贴参数行识别规则（必须遵守）\n1. 用户如果直接粘贴一行或多行参数表数据，例如 “boiler_capacity\t锅炉容量\t\
            660000\tMW\t技术协议｜...” 或 “boiler_capacity 锅炉容量 660000 MW 技术协议｜...”，即使没有出现“参数修改”，也必须识别为\
            \ route=modify、target_table=param、action=param_row_update。\n2. 这种输入表示用户要用本轮提供的参数标识、中文名称、数值、单位更新历史参数表中匹配的参数行。\n\
            3. source_terms 填参数标识列表，target_terms 填 key=value 列表，不要识别为 query。\n"
