    - data:
        code: "import re\n\n\ndef _clean(value):\n    return str(value or \"\").strip()\n\
          \n\ndef _compact(value):\n    return re.sub(r\"\\s+\", \"\", _clean(value)).lower()\n\
          \n\ndef _contains_any(text, words):\n    compact = _compact(text)\n    return\
          \ any(str(word).lower() in compact for word in words)\n\n\ndef _cn_number_to_int(value)\
          \ -> int:\n    text = _clean(value)\n    if not text:\n        return 0\n\
          \    if text.isdigit():\n        return int(text)\n    text = text.replace(\"\
          两\", \"二\")\n    digits = {\"零\": 0, \"一\": 1, \"二\": 2, \"三\": 3, \"四\"\
          : 4, \"五\": 5, \"六\": 6, \"七\": 7, \"八\": 8, \"九\": 9}\n    if text in digits:\n\
          \        return digits[text]\n    if \"十\" in text:\n        left, right\
          \ = text.split(\"十\", 1)\n        tens = digits.get(left, 1) if left else\
          \ 1\n        ones = digits.get(right, 0) if right else 0\n        return\
          \ tens * 10 + ones\n    return 0\n\n\ndef _selection_choice_texts(value:\
          \ str) -> list:\n    text = _clean(value)\n    if not text:\n        return\
          \ []\n    compact = re.sub(r\"\\s+\", \"\", text)\n    if re.fullmatch(r\"\
          (?:全选|全部|全部都要|全都要|都要|都选|全要|所有|所有都要)\", compact):\n        return [\"all\"\
          ]\n    if not re.search(r\"(第|选|选择|确认|确定|个|项|号|候选|全部|全选|都要|和|与|及|、|,|，|到|至|~|-)\"\
          , compact) and not re.fullmatch(r\"[0-9一二两三四五六七八九十]+\", compact):\n    \
          \    return []\n    choices = []\n    seen = set()\n\n    def add_choice(token):\n\
          \        index = _cn_number_to_int(token)\n        if index <= 0 or index\
          \ in seen:\n            return\n        seen.add(index)\n        choices.append(str(index))\n\
          \n    for match in re.finditer(r\"第?([0-9一二两三四五六七八九十]+)(?:个|项|号)?(?:到|至|~|-|—)第?([0-9一二两三四五六七八九十]+)(?:个|项|号)?\"\
          , compact):\n        start = _cn_number_to_int(match.group(1))\n       \
          \ end = _cn_number_to_int(match.group(2))\n        if start > 0 and end\
          \ >= start and end - start <= 20:\n            for index in range(start,\
          \ end + 1):\n                add_choice(str(index))\n    cleaned = re.sub(r\"\
          (?:选择|选|确认|确定|就|用|采用|第|个|项|号|候选|模型)\", \"\", compact)\n    cleaned = re.sub(r\"\
          (?:以及|并且|还有|和|与|及|、|,|，|/|;|；|\\+)\", \",\", cleaned)\n    for part in [item\
          \ for item in cleaned.split(\",\") if item]:\n        if re.fullmatch(r\"\
          [0-9一二两三四五六七八九十]+\", part):\n            add_choice(part)\n    if not choices:\n\
          \        for token in re.findall(r\"第([0-9一二两三四五六七八九十]+)(?:个|项|号)?\", compact):\n\
          \            add_choice(token)\n    return choices\n\n\ndef _looks_like_model_design(query:\
          \ str) -> bool:\n    text = _clean(query)\n    compact = _compact(query)\n\
          \    if not text:\n        return False\n    normal_flow_words = (\n   \
          \     \"选型计算\", \"参数提取\", \"提取参数\", \"参数补充\", \"补充参数\", \"开始计算\",\n    \
          \    \"公式计算\", \"查询外购件\", \"参数修改\", \"修改参数\", \"锅炉容量\", \"boiler_capacity\"\
          ,\n    )\n    if _contains_any(text, normal_flow_words):\n        return\
          \ False\n    if _selection_choice_texts(text):\n        return True\n  \
          \  if re.fullmatch(r\"(?:使用|试用|采用|套用|按|用)?默认(?:参数|值)?\", compact):\n   \
          \     return True\n    if _contains_any(text, (\"生成模型\", \"插入模型\", \"放入模型\"\
          , \"选中模型\", \"打开参数页\")):\n        return True\n    design_words = (\n  \
          \      \"设计\", \"生成\", \"创建\", \"新建\", \"建模\", \"模型\", \"参数化\", \"斜梯\",\
          \ \"斜体\",\n        \"楼梯\", \"梯子\", \"平台\", \"护栏\", \"栏杆\", \"扶栏\", \"烟道\"\
          , \"天圆地方\",\n        \"翅片\", \"翅片管\", \"盒子\", \"方块\", \"长方体\", \"箱体\",\n\
          \    )\n    return _contains_any(text, design_words)\n\n\ndef main(query:\
          \ str = \"\", last_markdown: str = \"\", param_markdown: str = \"\", recognized_text:\
          \ str = \"\") -> dict:\n    route = \"model_design\" if _looks_like_model_design(query)\
          \ else \"selection_calc\"\n    reason = \"模型设计/知识图谱流程\" if route == \"model_design\"\
          \ else \"技术协议识别/选型计算流程\"\n    return {\n        \"route\": route,\n    \
          \    \"reason\": reason,\n        \"query\": _clean(query),\n    }\n"
