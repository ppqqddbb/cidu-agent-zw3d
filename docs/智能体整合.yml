        code: "import json\nimport re\n\n\nPARAM_PATTERNS = {\n    \"equipment_count\"\
          : r\"(?:设备数量|设备数|台数|数量)\\s*[:：]?\\s*([0-9]+)\\s*(?:台|套)?\",\n    \"design_pressure\"\
          : r\"(?:设计压力|压力)\\s*[:：]?\\s*([0-9]+(?:\\.[0-9]+)?)\\s*(?:MPa|兆帕)?\",\n\
          \    \"length\": r\"(?:长度|长)\\s*[:：]?\\s*([0-9]+(?:\\.[0-9]+)?)\\s*(?:mm|毫米)?\"\
          ,\n    \"width\": r\"(?:宽度|宽|内宽)\\s*[:：]?\\s*([0-9]+(?:\\.[0-9]+)?)\\s*(?:mm|毫米)?\"\
          ,\n    \"height\": r\"(?:高度|高)\\s*[:：]?\\s*([0-9]+(?:\\.[0-9]+)?)\\s*(?:mm|毫米)?\"\
          ,\n    \"angle\": r\"(?:角度)\\s*[:：]?\\s*([0-9]+(?:\\.[0-9]+)?)\\s*(?:度|°)?\"\
          ,\n}\n\n\ndef _clean(value) -> str:\n    return str(value or \"\").strip()\n\
          \n\ndef _cn_number_to_int(value) -> int:\n    text = _clean(value)\n   \
          \ if not text:\n        return 0\n    if text.isdigit():\n        return\
          \ int(text)\n    text = text.replace(\"两\", \"二\")\n    digits = {\"零\"\
          : 0, \"一\": 1, \"二\": 2, \"三\": 3, \"四\": 4, \"五\": 5, \"六\": 6, \"七\":\
          \ 7, \"八\": 8, \"九\": 9}\n    if text in digits:\n        return digits[text]\n\
          \    if \"十\" in text:\n        left, right = text.split(\"十\", 1)\n   \
          \     tens = digits.get(left, 1) if left else 1\n        ones = digits.get(right,\
          \ 0) if right else 0\n        return tens * 10 + ones\n    return 0\n\n\n\
          def _selection_choice_texts(value: str) -> list:\n    text = _clean(value)\n\
          \    if not text:\n        return []\n    compact = re.sub(r\"\\s+\", \"\
          \", text)\n    if re.fullmatch(r\"(?:全选|全部|全部都要|全都要|都要|都选|全要|所有|所有都要)\"\
          , compact):\n        return [\"all\"]\n    if not re.search(r\"(第|选|选择|确认|确定|个|项|号|候选|全部|全选|都要|和|与|及|、|,|，|到|至|~|-)\"\
          , compact) and not re.fullmatch(r\"[0-9一二两三四五六七八九十]+\", compact):\n    \
          \    return []\n    choices = []\n    seen = set()\n\n    def add_choice(token):\n\
          \        index = _cn_number_to_int(token)\n        if index <= 0 or index\
          \ in seen:\n            return\n        seen.add(index)\n        choices.append(str(index))\n\
          \n    for match in re.finditer(r\"第?([0-9一二两三四五六七八九十]+)(?:个|项|号)?(?:到|至|~|-|—)第?([0-9一二两三四五六七八九十]+)(?:个|项|号)?\"\
          , compact):\n        start = _cn_number_to_int(match.group(1))\n       \
          \ end = _cn_number_to_int(match.group(2))\n        if start > 0 and end\
          \ >= start and end - start <= 20:\n            for index in range(start,\
          \ end + 1):\n                add_choice(str(index))\n    cleaned = re.sub(r\"\
          (?:选择|选|确认|确定|就|用|采用|第|个|项|号|候选|模型)\", \"\", compact)\n    cleaned = re.sub(r\"\
          (?:以及|并且|还有|和|与|及|、|,|，|/|;|；|\\+)\", \",\", cleaned)\n    for part in [item\
          \ for item in cleaned.split(\",\") if item]:\n        if re.fullmatch(r\"\
          [0-9一二两三四五六七八九十]+\", part):\n            add_choice(part)\n    if not choices:\n\
          \        for token in re.findall(r\"第([0-9一二两三四五六七八九十]+)(?:个|项|号)?\", compact):\n\
          \            add_choice(token)\n    return choices\n\n\ndef _selection_choice_text(value:\
          \ str) -> str:\n    choices = _selection_choice_texts(value)\n    return\
          \ choices[0] if choices else \"\"\n\n\ndef _detect_operation_action(text:\
          \ str) -> str:\n    compact = re.sub(r\"\\s+\", \"\", _clean(text))\n  \
          \  if not compact:\n        return \"\"\n    if re.search(r\"(插入|生成到模型|放入模型|加入模型)\"\
          , compact):\n        return \"insert\"\n    if re.search(r\"(打开|开启)\", compact):\n\
          \        return \"open\"\n    if re.search(r\"(选中模型|选择模型|打开参数页|进入参数页)\"\
          , compact):\n        return \"selectModel\"\n    return \"\"\n\n\ndef _extract_parameters(text:\
          \ str) -> dict:\n    result = {}\n    for code, pattern in PARAM_PATTERNS.items():\n\
          \        match = re.search(pattern, text or \"\", re.I)\n        if match:\n\
          \            result[code] = match.group(1)\n    return result\n\n\ndef main(query:\
          \ str = \"\") -> dict:\n    extracted_parameters = _extract_parameters(query\
          \ or \"\")\n    choices = _selection_choice_texts(query)\n    choice = choices[0]\
          \ if choices else \"\"\n    operation_action = _detect_operation_action(query)\n\
          \    if operation_action:\n        intent = \"operation_command\"\n    elif\
          \ choices:\n        intent = \"confirm_selection\"\n    else:\n        intent\
          \ = \"new_selection\"\n    signals = {\n        \"text\": \"\\n\".join(item\
          \ for item in [query] if _clean(item)),\n        \"keywords\": [],\n   \
          \     \"model_name_hints\": [],\n        \"template_hints\": [],\n     \
          \   \"context_terms\": [],\n        \"category_expansion_terms\": [],\n\
          \        \"retrieval_strategy\": \"prefer_product_model_leaf\",\n      \
          \  \"selection_qualifiers\": [],\n        \"candidate_node_type\": \"ProductModel\"\
          ,\n        \"extracted_parameters\": extracted_parameters,\n        \n \
          \       \"selection_choice\": choice,\n        \"selection_choices\": choices,\n\
          \        \"selection_confirmed_candidate\": {},\n        \"selection_confirmed_candidates\"\
          : [],\n        \"previous_candidates\": [],\n        \"intent\": intent,\n\
          \        \"operation_action\": operation_action,\n    }\n    return {\n\
          \        \"intent\": intent,\n        \"signals_json\": json.dumps(signals,\
          \ ensure_ascii=False, separators=(\",\", \":\")),\n        \"empty_retrieval_result\"\
          : [],\n    }\n"
