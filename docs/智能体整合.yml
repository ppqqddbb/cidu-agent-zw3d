          \ raw\n\ndef _copy_block(param_markdown: str):\n    rows = _parse_param_table(param_markdown)\n\
          \    if not rows:\n        return \"\"\n    lines = []\n    for key, label,\
          \ unit in PARAM_LABELS:\n        row = rows.get(key)\n        if not row:\n\
          \            value = DEFAULT_PARAM_VALUES.get(key, \"null\")\n        else:\n\
          \            value = row[\"value\"]\n            evidence = row.get(\"evidence\"\
          , \"\")\n            if not _is_missing(value, evidence):\n            \
          \    continue\n            value = _copy_value(key, value, evidence)\n \
          \       if unit:\n            left = f\"{key}（{label}，单位 {unit}）\"\n   \
          \     else:\n            left = f\"{key}（{label}）\"\n        lines.append(f\"\
          {left}={value}\")\n    if not lines:\n        lines = [\"无缺失参数\"]\n    return\
          \ \"```text\\n\" + \"\\n\".join(lines) + \"\\n```\"\n\ndef _next_step(source_kind:\
          \ str, route: str, has_param: bool, has_markdown: bool, recognition_text:\
          \ str):\n    kind = _strip(source_kind)\n    route = _strip(route)\n   \
          \ if _strip(recognition_text) and not kind and not route:\n        return\
          \ \"下一步：可以输入“选型计算”；如果只想查看某项内容，也可以直接提问。\"\n    if route == \"message\":\n\
          \        return \"下一步：请按上方提示补齐当前步骤；通常可先上传文件或输入“参数提取”。\"\n    if kind ==\
          \ \"extract\":\n        return \"下一步：已完成参数提取，并已根据“知识库全文更新文档”自动补充缺失项。请核对表格；若某个值不对，可直接说“把某参数改为...”；确认无误后输入“开始计算”。\"\
          \n    if kind == \"supplement\":\n        return \"下一步：已完成参数补充并合并。你可以继续手动修改参数，或输入“开始计算”调用公式进行设备选型计算。\"\
          \n    if kind == \"modify\":\n        return \"下一步：已按要求修改。若参数还不完整，可输入“参数补充”；确认后输入“开始计算”。\"\
          \n    if kind == \"calculate\":\n        return \"下一步：如需调整结果，请先修改对应参数，再输入“开始计算”重新计算。\"\
          \n    if kind == \"query\":\n        return \"下一步：可继续查询识别内容；也可以输入“参数提取”生成参数表。\"\
          \n    if has_param:\n        return \"下一步：可输入“参数补充”自动补全参数，或输入“开始计算”进行设备选型计算。\"\
          \n    if has_markdown:\n        return \"下一步：可继续查询、修改当前 Markdown，或输入“参数提取”生成参数表。\"\
          \n    return \"下一步：请上传文件后输入“参数提取”，或直接说明要查询的内容。\"\n\ndef main(recognition_text:\
          \ str = \"\", gate_text: str = \"\", markdown_text: str = \"\", route: str\
          \ = \"\", source_kind: str = \"\", param_markdown: str = \"\") -> dict:\n\
          \    recognition = _strip(recognition_text)\n    gate = _strip(gate_text)\n\
          \    markdown = _strip(markdown_text)\n    param_table = _strip(param_markdown)\n\
          \    base = recognition or gate or markdown\n    if not base:\n        base\
          \ = \"请先上传文件，或输入你要查询、提取、补充、修改、计算的内容。\"\n    extras = []\n    if _strip(source_kind)\
          \ in (\"extract\", \"supplement\"):\n        block = _copy_block(param_table\
          \ or markdown)\n        if block:\n            extras.append(\"## 可复制参数\\\
          n\\n\" + block)\n    next_step = _next_step(source_kind, route, bool(param_table),\
          \ bool(markdown), recognition)\n    extras.append(next_step)\n    return\
          \ {\"response_text\": base + \"\\n\\n\" + \"\\n\\n\".join(extras)}\n"
