        code: "import re\n\n\ndef _clean(value):\n    return str(value or \"\").strip()\n\
          \n\ndef _extract_equipment_selection(markdown: str) -> str:\n    text =\
          \ _clean(markdown)\n    if not text:\n        return \"\"\n    marker =\
          \ \"## 设备选型结果\"\n    if marker in text:\n        section = text.split(marker,\
          \ 1)[1]\n        next_marker = re.search(r\"\\n##\\s+\", section)\n    \
          \    if next_marker:\n            section = section[:next_marker.start()]\n\
          \        return section.strip()\n    if \"设备选型结果\" in text and \"设备名称\"\
          \ in text and \"设备型号/参数\" in text:\n        return text\n    return \"\"\
          \n\n\ndef _summarize_for_design(equipment_markdown: str, param_markdown:\
          \ str) -> str:\n    parts = []\n    if equipment_markdown:\n        parts.append(\"\
          上一步“开始计算”得到的设备选型结果如下，后续模型设计必须优先使用这些型号、尺寸、参数：\\n\" + equipment_markdown)\n\
          \    if _clean(param_markdown):\n        parts.append(\"当前已保存参数表如下，可作为模型设计参数来源：\\\
          n\" + _clean(param_markdown))\n    return \"\\n\\n\".join(parts)\n\n\ndef\
          \ main(query: str = \"\", last_markdown: str = \"\", param_markdown: str\
          \ = \"\", recognized_text: str = \"\") -> dict:\n    equipment = _extract_equipment_selection(last_markdown)\n\
          \    context = _summarize_for_design(equipment, param_markdown)\n    if\
          \ not context:\n        context = \"当前未检测到“开始计算”的设备选型结果。若用户要设计模型，请先根据知识图谱给出候选模型，并提示用户可先输入“开始计算”生成设备选型结果。\"\
          \n    instruction = (\n        \"你正在把除渣系统设备选型结果对接到 Jiavu 参数化模型知识库/知识图谱。\"\
          \n        \"当用户提出模型设计需求时，请结合设备选型结果中对应设备名称、型号、尺寸和参数，\"\n        \"自动提取模型需要的参数；如果缺少参数，再向用户说明需要补充哪些字段。\"\
          \n    )\n    return {\n        \"ocr_text\": context,\n        \"target\"\
          : _clean(query),\n        \"instruction\": instruction,\n        \"equipment_selection_markdown\"\
          : equipment,\n    }\n"
