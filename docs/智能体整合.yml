          , \"n/a\", \"na\", \"未识别\", \"待补充\", \"待确认\", \"未知\", \"未找到明确依据\", \"全文检索未匹配\"\
          }\n\ndef _strip(value):\n    return str(value or \"\").strip()\n\ndef _has_header(markdown:\
          \ str, names) -> bool:\n    text = str(markdown or \"\")\n    return all(name\
          \ in text for name in names)\n\ndef _is_param_table(markdown: str) -> bool:\n\
          \    text = str(markdown or \"\")\n    if \"参数标识\" not in text:\n      \
          \  return False\n    has_value_col = any(name in text for name in (\"提取数值\"\
          , \"数值\", \"识别结果\", \"参数值\"))\n    has_evidence_col = any(name in text for\
          \ name in (\"证据溯源\", \"依据\", \"取得途径\", \"来源\"))\n    return has_value_col\
          \ and has_evidence_col\n\ndef _is_external_table(markdown: str) -> bool:\n\
          \    return _has_header(markdown, (\"序号\", \"设备名称\", \"识别结果\", \"数量\", \"\
          单位\", \"依据\"))\n\ndef _is_missing(value: str, evidence: str = \"\") -> bool:\n\
          \    raw = _strip(value)\n    if raw.lower() in NULL_VALUES:\n        return\
          \ True\n    ev = _strip(evidence)\n    return any(marker in ev for marker\
          \ in (\"未找到\", \"无明确依据\", \"缺失\", \"未提供\", \"未识别\"))\n\ndef _missing_evidence(evidence:\
          \ str = \"\") -> str:\n    ev = _strip(evidence)\n    if \"知识库\" in ev:\n\
          \        return \"知识库全文｜未找到明确依据\"\n    return \"技术协议｜未找到明确依据\"\n\ndef _clean_cell(value:\
          \ str) -> str:\n    return _strip(value).replace(\"|\", \"｜\").replace(\"\
          \\n\", \" \") or \"-\"\n\ndef _normalize_param_markdown(markdown: str) ->\
          \ str:\n    text = str(markdown or \"\").strip()\n    if not _is_param_table(text):\n\
          \        return text\n\n    value_names = {\"提取数值\", \"数值\", \"识别结果\", \"\
          参数值\", \"使用值\", \"设备型号/参数\"}\n    evidence_names = {\"证据溯源\", \"依据\", \"\
          来源/证据\", \"取得途径\", \"来源\"}\n    headers = []\n    value_idx = None\n   \
          \ evidence_idx = None\n    lines = []\n\n    for line in text.splitlines():\n\
          \        if \"|\" not in line:\n            lines.append(line)\n       \
          \     continue\n\n        cells = [cell.strip() for cell in line.strip().strip(\"\
          |\").split(\"|\")]\n        if len(cells) < 3:\n            lines.append(line)\n\
          \            continue\n\n        if any(\"---\" in cell for cell in cells):\n\
          \            lines.append(line)\n            continue\n\n        if cells[0]\
          \ in (\"参数标识\", \"序号\") or any(cell in value_names for cell in cells):\n\
          \            headers = cells\n            value_idx = None\n           \
          \ evidence_idx = None\n            for idx, header in enumerate(headers):\n\
          \                if header in value_names:\n                    value_idx\
          \ = idx\n                if header in evidence_names:\n                \
          \    evidence_idx = idx\n            lines.append(\"| \" + \" | \".join(_clean_cell(cell)\
          \ for cell in cells) + \" |\")\n            continue\n\n        if headers\
          \ and value_idx is not None and evidence_idx is not None:\n            key\
          \ = cells[0].strip()\n            if re.match(r\"^[A-Za-z_][A-Za-z0-9_]*$\"\
          , key) and value_idx < len(cells) and evidence_idx < len(cells):\n     \
          \           if _is_missing(cells[value_idx], cells[evidence_idx]):\n   \
          \                 cells[value_idx] = \"null\"\n                    cells[evidence_idx]\
          \ = _missing_evidence(cells[evidence_idx])\n            lines.append(\"\
          | \" + \" | \".join(_clean_cell(cell) for cell in cells) + \" |\")\n   \
          \     else:\n            lines.append(line)\n\n    return \"\\n\".join(lines).strip()\n\
          \ndef main(\n    query_markdown: str = \"\",\n    modified_markdown: str\
          \ = \"\",\n    extracted_markdown: str = \"\",\n    supplemented_markdown:\
          \ str = \"\",\n    calculated_markdown: str = \"\",\n    existing_param_markdown:\
          \ str = \"\",\n    existing_external_markdown: str = \"\",\n    route: str\
          \ = \"\",\n    edit_kind: str = \"\",\n) -> dict:\n    query_text = _normalize_param_markdown(str(query_markdown\
          \ or \"\").strip())\n    modified_text = _normalize_param_markdown(str(modified_markdown\
          \ or \"\").strip())\n    extracted_text = _normalize_param_markdown(str(extracted_markdown\
          \ or \"\").strip())\n    supplemented_text = _normalize_param_markdown(str(supplemented_markdown\
          \ or \"\").strip())\n    calculated_text = str(calculated_markdown or \"\
          \").strip()\n    existing_param = _normalize_param_markdown(str(existing_param_markdown\
          \ or \"\").strip())\n    existing_external = str(existing_external_markdown\
          \ or \"\").strip()\n    route_text = str(route or \"\").strip()\n    kind\
          \ = str(edit_kind or \"\").strip()\n\n    if calculated_text:\n        return\
          \ {\"markdown_text\": calculated_text, \"param_markdown_text\": existing_param,\
          \ \"external_markdown_text\": existing_external, \"source_kind\": \"calculate\"\
          }\n    if supplemented_text:\n        source_kind = \"extract\" if route_text\
          \ == \"extract\" and extracted_text else \"supplement\"\n        return\
          \ {\"markdown_text\": supplemented_text, \"param_markdown_text\": supplemented_text,\
          \ \"external_markdown_text\": existing_external, \"source_kind\": source_kind}\n\
          \    if modified_text:\n        next_param = existing_param\n        next_external\
          \ = existing_external\n        if _is_param_table(modified_text) or kind\
          \ == \"param\":\n            next_param = modified_text\n        if _is_external_table(modified_text)\
          \ or kind == \"external\":\n            next_external = modified_text\n\
          \        return {\"markdown_text\": modified_text, \"param_markdown_text\"\
          : next_param, \"external_markdown_text\": next_external, \"source_kind\"\
          : \"modify\"}\n    if extracted_text:\n        return {\"markdown_text\"\
          : extracted_text, \"param_markdown_text\": extracted_text, \"external_markdown_text\"\
          : existing_external, \"source_kind\": \"extract\"}\n    if query_text:\n\
          \        next_external = query_text if _is_external_table(query_text) else\
          \ existing_external\n        next_param = query_text if _is_param_table(query_text)\
          \ else existing_param\n        return {\"markdown_text\": query_text, \"\
          param_markdown_text\": next_param, \"external_markdown_text\": next_external,\
          \ \"source_kind\": \"query\"}\n    return {\"markdown_text\": \"\", \"param_markdown_text\"\
          : existing_param, \"external_markdown_text\": existing_external, \"source_kind\"\
          : \"\"}\n"
